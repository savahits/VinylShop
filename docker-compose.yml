version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: vinylshop-postgres
    environment:
      POSTGRES_DB: vinylshop
      POSTGRES_USER: savelii
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vinylshop-network

  app:
    build: .
    container_name: vinylshop-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vinylshop
      SPRING_DATASOURCE_USERNAME: savelii
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      - postgres
    networks:
      - vinylshop-network

networks:
  vinylshop-network:
    driver: bridge

volumes:
  postgres_data: